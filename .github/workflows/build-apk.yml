name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes the Android SDK and sdkmanager.
      # setup-android@v3 attempts to install removed package 'tools' and fails.
      - name: Install Android 35 build platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Avanegar-Persian-v0.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
